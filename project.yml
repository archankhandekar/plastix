# XcodeGen specification. Run `xcodegen generate` in this directory to create
# SymmetryPrototype.xcodeproj. See README for the manual alternative.
name: SymmetryPrototype
options:
  bundleIdPrefix: org.research.symmetry
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  SymmetryCore:
    path: .
targets:
  SymmetryPrototype:
    type: application
    platform: iOS
    sources:
      - path: App/SymmetryPrototype
        excludes:
          - "Info.plist"
    dependencies:
      - package: SymmetryCore
        product: SymmetryCore
      - package: SymmetryCore
        product: SymmetryModels
    info:
      path: App/SymmetryPrototype/Info.plist
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/SymmetryPrototype/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
