name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-tests-linux:
    name: Package tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Run SymmetryCore and SymmetryModels tests
        run: swift test

  package-tests-macos:
    name: Package tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n1)/Contents/Developer" && xcodebuild -version
      - name: Run SymmetryCore and SymmetryModels tests
        run: swift test

  ios-app-build:
    name: iOS app build (simulator, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n1)/Contents/Developer" && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          xcodegen generate
      - name: Build the app for the iOS simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project SymmetryPrototype.xcodeproj \
            -scheme SymmetryPrototype \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
