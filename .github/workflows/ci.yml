name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-tests-linux:
    name: Package tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Run SymmetryCore and SymmetryModels tests
        run: swift test

  package-tests-macos:
    name: Package tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n1)/Contents/Developer" && xcodebuild -version
      - name: Run SymmetryCore and SymmetryModels tests
        run: swift test

  ios-app-build:
    name: iOS app build (simulator, unsigned)
    runs-on: macos-15
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n1)/Contents/Developer" && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          xcodegen generate
      - name: Build the app for the iOS simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project SymmetryPrototype.xcodeproj \
            -scheme SymmetryPrototype \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            > build/xcodebuild.log 2>&1 || true
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" build/xcodebuild.log | sort -u | head -n 80 || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log
      - name: Report compiler errors where the API can read them
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Check-run annotations (readable via the REST API) for the first errors.
          grep -E "error:" build/xcodebuild.log | sort -u | head -n 40 | while IFS= read -r line; do
            file=$(printf '%s' "$line" | sed -nE 's#^(/[^:]+):([0-9]+):([0-9]+): error: .*#\1#p' | sed "s#^$GITHUB_WORKSPACE/##")
            row=$(printf '%s' "$line" | sed -nE 's#^/[^:]+:([0-9]+):[0-9]+: error: .*#\1#p')
            msg=$(printf '%s' "$line" | sed -E 's#^.*error: ##')
            if [ -n "$file" ] && [ -n "$row" ]; then
              echo "::error file=$file,line=$row::$msg"
            else
              echo "::error::$line"
            fi
          done
          # Also a PR comment with the same lines, when this is a pull request build.
          if [ -n "$PR_NUMBER" ]; then
            {
              echo "**iOS app build failed** on \`${GITHUB_SHA::7}\`. First compiler errors:"
              echo
              echo '```'
              grep -E "error:" build/xcodebuild.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -n 40
              echo '```'
              echo
              echo "Full log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } > build/comment.md
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@build/comment.md >/dev/null
          fi
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
